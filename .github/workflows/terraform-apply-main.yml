name: Terraform Apply (main)

on:
  pull_request:
    branches: [ 'main' ]
    types: [ opened, synchronize, reopened ]

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: aws/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'


      - name: Terraform Format
        run: terraform fmt -recursive .

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload apply outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-outputs
          path: |
            aws/terraform/.terraform
            aws/terraform/tfplan

# IMPORTANT:
# - This workflow will run `terraform apply -auto-approve` on pushes to `main`.
# - For safer operations, protect the `production` environment in GitHub to require manual approvals.
# - Ensure repository secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `AWS_REGION` are set.
