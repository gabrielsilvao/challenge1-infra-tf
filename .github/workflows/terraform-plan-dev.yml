name: Terraform Plan (dev)

on:
  push:
    branches: [ 'dev' ]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tfsec - Static analysis for Terraform security issues
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: aws/terraform
          soft_fail: true

      # Checkov - Policy-as-code for Terraform
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: aws/terraform
          framework: terraform
          soft_fail: true
          output_format: cli
          skip_check: CKV_AWS_144,CKV_AWS_145  # Skip cross-region replication checks

      # Trivy - Vulnerability scanner for IaC
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'aws/terraform'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: security
    defaults:
      run:
        working-directory: aws/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Terraform Format
        run: terraform fmt -check -recursive .

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          TF_VAR_datadog_enabled: ${{ secrets.DATADOG_ENABLED }}
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_site: ${{ secrets.DATADOG_SITE }}
